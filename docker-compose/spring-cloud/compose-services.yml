name: xpenser-services

volumes:
  expense-documents:

services:
  xpenser-expense-service-01:
    image: consolefire.com/xpenser/xpenser-expense-service:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-expense-service-01
    restart: on-failure
    ports:
      - "19030:8080"
    environment:
      DB_HOST: host.docker.internal
      EXPENSE_SERVICE_SERVER_PORT: 8080
      DISCOVERY_ENABLED: true
      DISCOVERY_SERVER_URL: http://host.docker.internal:18761/eureka/,http://host.docker.internal:18762/eureka/,http://host.docker.internal:18763/eureka/
      DISCOVERY_INSTANCE_HOSTNAME: host.docker.internal
      CONFIG_SERVER_URL: http://host.docker.internal:18660/
      CONFIG_REPO_BRANCH_NAME: main
      SPRING_APPLICATION_NAME: xpenser-expense-service
      SPRING_PROFILES_ACTIVE: spring-cloud-infra,dev

  xpenser-expense-service-02:
    image: consolefire.com/xpenser/xpenser-expense-service:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-expense-service-02
    restart: on-failure
    ports:
      - "19031:8080"
    environment:
      DB_HOST: host.docker.internal
      EXPENSE_SERVICE_SERVER_PORT: 8080
      DISCOVERY_ENABLED: true
      DISCOVERY_SERVER_URL: http://host.docker.internal:18761/eureka/,http://host.docker.internal:18762/eureka/,http://host.docker.internal:18763/eureka/
      DISCOVERY_INSTANCE_HOSTNAME: host.docker.internal
      CONFIG_SERVER_URL: http://host.docker.internal:18661/
      CONFIG_REPO_BRANCH_NAME: main
      SPRING_APPLICATION_NAME: xpenser-expense-service
      SPRING_PROFILES_ACTIVE: spring-cloud-infra,dev

  xpenser-document-service-01:
    image: consolefire.com/xpenser/xpenser-document-service:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-document-service-01
    restart: on-failure
    ports:
      - "19040:8080"
    environment:
      DB_HOST: host.docker.internal
      EXPENSE_DOCUMENT_APP_PORT: 8080
      DISCOVERY_ENABLED: true
      DISCOVERY_SERVER_URL: http://host.docker.internal:18761/eureka/,http://host.docker.internal:18762/eureka/,http://host.docker.internal:18763/eureka/
      DISCOVERY_INSTANCE_HOSTNAME: host.docker.internal
      CONFIG_SERVER_URL: http://host.docker.internal:18660/
      CONFIG_REPO_BRANCH_NAME: main
      SPRING_APPLICATION_NAME: xpenser-document-service
      SPRING_PROFILES_ACTIVE: spring-cloud-infra,dev
      EXPENSE_DOCUMENT_ROOT: /var/logs/xpenser/expense-documents
    volumes:
      - type: bind
        source: ./volumes/documents
        target: /var/logs/xpenser/expense-documents

  xpenser-document-service-02:
    image: consolefire.com/xpenser/xpenser-document-service:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-document-service-02
    restart: on-failure
    ports:
      - "19041:8080"
    environment:
      DB_HOST: host.docker.internal
      EXPENSE_DOCUMENT_APP_PORT: 8080
      DISCOVERY_ENABLED: true
      DISCOVERY_SERVER_URL: http://host.docker.internal:18761/eureka/,http://host.docker.internal:18762/eureka/,http://host.docker.internal:18763/eureka/
      DISCOVERY_INSTANCE_HOSTNAME: host.docker.internal
      CONFIG_SERVER_URL: http://host.docker.internal:18661/
      CONFIG_REPO_BRANCH_NAME: main
      SPRING_APPLICATION_NAME: xpenser-document-service
      SPRING_PROFILES_ACTIVE: spring-cloud-infra,dev
      EXPENSE_DOCUMENT_ROOT: /var/logs/xpenser/expense-documents
    volumes:
      - type: bind
        source: ./volumes/documents
        target: /var/logs/xpenser/expense-documents
