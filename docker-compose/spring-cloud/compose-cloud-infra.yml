
name: xpenser-spring-cloud-infra

services:


  xpenser-config-server-01:
    image: consolefire.com/xpenser/xpenser-config-server:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-config-server-01
    expose:
      - 8888
    ports:
      - "18660:8888"
    environment:
      CONFIG_SERVER_SERVER_PORT: 8888
  xpenser-config-server-02:
    image: consolefire.com/xpenser/xpenser-config-server:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-config-server-02
    depends_on:
      - xpenser-config-server-01
    expose:
      - 8888
    ports:
      - "18661:8888"
    environment:
      CONFIG_SERVER_SERVER_PORT: 8888


  xpenser-cloud-discovery-01:
    image: consolefire.com/xpenser/xpenser-discovery-server:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-cloud-discovery-01
    ports:
      - "18761:8760"
    environment:
      SPRING_APPLICATION_NAME: xpenser-discovery-server-01
      EUREKA_PREFER_IP_ADDRESS: true
      EUREKA_PEER_1_HOST: xpenser-cloud-discovery-01
      EUREKA_PEER_1_PORT: 8760
      EUREKA_PEER_2_HOST: xpenser-cloud-discovery-02
      EUREKA_PEER_2_PORT: 8760
      EUREKA_PEER_3_HOST: xpenser-cloud-discovery-03
      EUREKA_PEER_3_PORT: 8760
      SPRING_PROFILES_ACTIVE: default,3peer,peer1
  xpenser-cloud-discovery-02:
    image: consolefire.com/xpenser/xpenser-discovery-server:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-cloud-discovery-02
    ports:
      - "18762:8760"
    environment:
      SPRING_APPLICATION_NAME: xpenser-discovery-server-02
      EUREKA_PREFER_IP_ADDRESS: true
      EUREKA_PEER_1_HOST: xpenser-cloud-discovery-01
      EUREKA_PEER_1_PORT: 8760
      EUREKA_PEER_2_HOST: xpenser-cloud-discovery-02
      EUREKA_PEER_2_PORT: 8760
      EUREKA_PEER_3_HOST: xpenser-cloud-discovery-03
      EUREKA_PEER_3_PORT: 8760
      SPRING_PROFILES_ACTIVE: default,3peer,peer2
  xpenser-cloud-discovery-03:
    image: consolefire.com/xpenser/xpenser-discovery-server:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-cloud-discovery-03
    ports:
      - "18763:8760"
    environment:
      SPRING_APPLICATION_NAME: xpenser-discovery-server-03
      EUREKA_PREFER_IP_ADDRESS: true
      EUREKA_PEER_1_HOST: xpenser-cloud-discovery-01
      EUREKA_PEER_1_PORT: 8760
      EUREKA_PEER_2_HOST: xpenser-cloud-discovery-02
      EUREKA_PEER_2_PORT: 8760
      EUREKA_PEER_3_HOST: xpenser-cloud-discovery-03
      EUREKA_PEER_3_PORT: 8760
      SPRING_PROFILES_ACTIVE: default,3peer,peer3

###

  xpenser-api-gateway-01:
    image: consolefire.com/xpenser/xpenser-api-gateway:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-api-gateway-01
    restart: on-failure
    links:
      - xpenser-config-server-01
      - xpenser-config-server-02
      - xpenser-cloud-discovery-01
      - xpenser-cloud-discovery-02
      - xpenser-cloud-discovery-03
    depends_on:
      - xpenser-config-server-01
      - xpenser-config-server-02
      - xpenser-cloud-discovery-01
      - xpenser-cloud-discovery-02
      - xpenser-cloud-discovery-03
    ports:
      - "19000:9000"
    environment:
      XPENSER_API_GATEWAY_SERVER_PORT: 9000
      DISCOVERY_ENABLED: true
      DISCOVERY_SERVER_URL: http://xpenser-cloud-discovery-01:8760/eureka/,http://xpenser-cloud-discovery-02:8760/eureka/,http://xpenser-cloud-discovery-03:8760/eureka/
      DISCOVERY_INSTANCE_HOSTNAME: xpenser-api-gateway-01
      CONFIG_SERVER_URL: http://xpenser-config-server-01:8888/
      CONFIG_REPO_BRANCH_NAME: main
      SPRING_APPLICATION_NAME: xpenser-api-gateway
      SPRING_PROFILES_ACTIVE: dev

  xpenser-api-gateway-02:
    image: consolefire.com/xpenser/xpenser-api-gateway:0.0.1-SNAPSHOT_jdk24_springcloud
    hostname: xpenser-api-gateway-02
    restart: on-failure
    links:
      - xpenser-config-server-01
      - xpenser-config-server-02
      - xpenser-cloud-discovery-01
      - xpenser-cloud-discovery-02
      - xpenser-cloud-discovery-03
    depends_on:
      - xpenser-config-server-01
      - xpenser-config-server-02
      - xpenser-cloud-discovery-01
      - xpenser-cloud-discovery-02
      - xpenser-cloud-discovery-03
    ports:
      - "19002:9000"
    environment:
      XPENSER_API_GATEWAY_SERVER_PORT: 9000
      DISCOVERY_ENABLED: true
      DISCOVERY_SERVER_URL: http://xpenser-cloud-discovery-01:8760/eureka/,http://xpenser-cloud-discovery-02:8760/eureka/,http://xpenser-cloud-discovery-03:8760/eureka/
      DISCOVERY_INSTANCE_HOSTNAME: xpenser-api-gateway-01
      CONFIG_SERVER_URL: http://xpenser-config-server-02:8888/
      CONFIG_REPO_BRANCH_NAME: main
      SPRING_APPLICATION_NAME: xpenser-api-gateway
      SPRING_PROFILES_ACTIVE: dev