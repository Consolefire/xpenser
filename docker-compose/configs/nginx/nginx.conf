# HTTP Proxy Configuration (remains mostly the same for your web services)
events {
    worker_connections 1024;
}

http {
    # Define upstreams for your backend HTTP services
    upstream discovery_backend {
        server cloud-discovery-01:8760;
        server cloud-discovery-02:8760;
        server cloud-discovery-03:8760;
    }

    upstream config_backend {
        server config-server-01:8690;
        server config-server-02:8690;
    }

    upstream gateway_backend {
        server xpenser-api-gateway-01:8900;
    }

    upstream auth_backend {
        server xpenser-auth-server-01:9000;
    }

    upstream user_backend {
        server xpenser-user-service-01:9100;
    }

    server {
        listen 80; # Nginx listens on port 80 inside the proxy container for HTTP traffic

        location /discovery/ {
            proxy_pass http://discovery_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /config/ {
            proxy_pass http://config_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /gateway/ {
            proxy_pass http://gateway_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://auth_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /user/ {
            proxy_pass http://user_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

# STREAM Proxy Configuration (for raw TCP/UDP traffic, like PostgreSQL)
stream {
    upstream postgres_backend {
        server xpenser-postgres-db:5432; # 'postgres-db' is the service name on xpenser_data_net
    }

    server {
        listen 5432; # Nginx listens on port 5432 inside the proxy container for DB traffic
        proxy_pass postgres_backend;
        # Optional: set proxy timeout if needed
        # proxy_connect_timeout 1s;
        # proxy_timeout 10s;
    }
}