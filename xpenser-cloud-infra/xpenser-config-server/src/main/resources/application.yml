
server:
  port: ${CONFIG_SERVER_SERVER_PORT:8888}

management:
  endpoints:
    web:
      base-path: "/admin"
      exposure:
        include: "*"
  endpoint:
    env:
      post:
        enabled: true


spring:
  cloud:
    config:
      name: ${SPRING_APPLICATION_NAME:xpenser-config-service}
      server:
        enabled: true
        accept-empty: false
        git:
          default-label: ${GIT_DEFAULT_BRANCH_NAME:main}
          skipSslValidation: true
          timeout: 4
          uri: https://github.com/Consolefire/cloud-config-repo
          repos:
            xpenser:
              uri: https://github.com/Consolefire/cloud-config-repo
              pattern: xpenser*
              search-paths:
                - /xpenser/{application}/