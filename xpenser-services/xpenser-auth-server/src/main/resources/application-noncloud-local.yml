commons:
  infra:
    database:
      postgresql:
        driver-class-name: org.postgresql.Driver
        host: ${DB_HOST:localhost}
        port: ${DB_PORT:15432}
        database-name: ${DB_SERVER_NAME:neverland}
        username: ${DB_USER:peterpan}
        password: ${DB_PASSWORD:P3terP@n}
        current-schema: ${DB_SCHEMA:xpenser_auth_server}
        #driver-options:
        #  k: validate

        pool: # Connection pool for R2DBC (e.g., r2dbc-pool)
          name: PG_POOL
          max-size: 10
          initial-size: 5
          max-idle-time: 30m
          validation-query: SELECT 1
          # Other pool properties as needed



services:
  user-service:
    host: ${XPENSER_USER_SERVICE_HOST:localhost}
    port: ${XPENSER_USER_SERVICE_PORT:9020}
    url: ${XPENSER_USER_SERVICE_URL:http://${services.user-service.host}:${services.user-service.port}}
  expense-service:
    host: ${XPENSER_EXPENSE_SERVICE_HOST:localhost}
    port: ${XPENSER_EXPENSE_SERVICE_PORT:9030}
    url: ${XPENSER_EXPENSE_SERVICE_URL:http://${services.expense-service.host}:${services.expense-service.port}}
  document-service:
    host: ${XPENSER_DOCUMENT_SERVICE_HOST:localhost}
    port: ${XPENSER_DOCUMENT_SERVICE_PORT:9040}
    url: ${XPENSER_DOCUMENT_SERVICE_URL:http://${services.document-service.host}:${services.document-service.port}}


# Custom properties for Authorization Server configuration
auth-server:
  issuer-uri: ${AUTH_ISSUER_URI:http://${server.hostname}:${server.port}}
  endpoints:
    authorization: /oauth2/authorize
    pushed-authorization-request: /oauth2/par
    device-authorization: /oauth2/device_authorization
    device-verification: /oauth2/device_verification
    token: /oauth2/token
    token-introspection: /oauth2/introspect
    token-revocation: /oauth2/revoke
    jwk-set: /oauth2/jwks
    oidc-logout: /connect/logout
    oidc-user-info: /userinfo
    oidc-client-registration: /connect/register


spring:
  datasource:
    url: jdbc:postgresql://${commons.infra.database.postgresql.host}:${commons.infra.database.postgresql.port}/${commons.infra.database.postgresql.database-name}?currentSchema=${commons.infra.database.postgresql.current-schema}
    username: ${commons.infra.database.postgresql.username}
    password: ${commons.infra.database.postgresql.password}
    driver-class-name: ${commons.infra.database.postgresql.driver-class-name}

    # HikariCP specific properties (optional, as Hikari has sensible defaults)
    hikari:
      pool-name: DB_POOL
      maximum-pool-size: 10 # Maximum number of connections in the pool
      minimum-idle: 2 # Minimum number of idle connections to maintain
      idle-timeout: 300000 # Maximum amount of time a connection can sit idle in the pool (ms, 5 minutes)
      connection-timeout: 30000 # Maximum number of milliseconds that a client will wait for a connection from the pool
      max-lifetime: 1800000 # Maximum lifetime of a connection in the pool (ms, 30 minutes)
      # auto-commit: true # Whether connections should be auto-committed
      # read-only: false # Whether connections should be read-only
      leak-detection-threshold: 2000 # How long a connection can be out of the pool before a warning is logged (ms)
      data-source-properties: # Properties to be set on the underlying JDBC DataSource
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048

  flyway: # Flyway still manages schema, even for R2DBC
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: ${spring.datasource.url}
    user: ${commons.infra.database.postgresql.username}
    password: ${commons.infra.database.postgresql.password}
    default-schema: ${commons.infra.database.postgresql.current-schema}



